<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142d32" />
    <title>시간탐험대 — 역사 탐험 RPG</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/revision.css?v=29.1" />
  </head>
  <body>
    <main id="game">
      <canvas id="world" aria-label="위에서 내려다보는 탐험 지도"> </canvas>
      <div id="title">
        <section class="title-card">
          <div class="title-hero"><img id="title-avatar" alt="탐험가" style="visibility:hidden" /></div>
          <div class="title-logo"><h1>시간 탐험대</h1><small>HISTORY EXPLORER</small></div>
          <div class="title-actions">
            <button id="new" class="primary">새 게임 시작하기</button>
            <button id="continue">이어하기</button>
            <button id="code-load-open">개인 코드로 이어하기</button>
          </div>
          <form id="code-form" class="code-form" autocomplete="off"><input id="code-input" aria-label="개인 코드" placeholder="HE000000" maxlength="8" /><button type="submit">불러오기</button></form>
          <div class="save-note">이 기기에는 자동 저장됩니다.</div>
          <button id="admin-open" class="admin-link">관리자 모드</button>
        </section>
      </div>
      <div id="hud" hidden>
        <header>
          <div class="player-panel">
            <img id="portrait" alt="내 캐릭터" />
            <div class="player-data">
              <div class="player-identity"><b id="name"> </b><span id="level"> </span><div id="wallet">◈ <b id="coins"> </b> <span>엽전</span></div></div>
              <div class="player-meters"><div class="meter"><small id="hp"> </small><div class="health-track"><i id="health"> </i></div></div><div class="meter"><small id="energy">기력 20 / 20</small><div class="health-track energy-track"><i id="energy-fill"></i></div></div></div>
            </div>
          </div>
          <div class="place-panel">
            <small id="era"> </small>
            <b id="place"> </b>
          </div>
          <nav class="hud-buttons">
            <button id="profile-btn">나</button
            ><button id="bag-btn">가방</button
            ><button id="menu-btn">탐험수첩</button
            ><button id="map-btn">지도</button><button id="mount-btn" hidden>말 타기</button
            ><button id="sound-btn" aria-label="음악 끄기">🔊</button>
          </nav>
        </header>
        <div class="story-hud">
          <span>메인스토리 <b id="story-count">0 / 20</b></span>
          <div><i id="story-progress"></i></div>
        </div>
        <aside id="quest">
          <button id="quest-toggle" aria-expanded="false" aria-controls="quest-extra"><span class="eyebrow">이야기 임무 <span id="quest-count"> </span></span><span class="quest-heading"><b id="quest-title"> </b><span id="quest-arrow" aria-hidden="true">▾</span></span></button>
          <div id="quest-extra" hidden><p id="quest-detail"></p><div id="quest-place"></div></div>
        </aside>
        <div class="mini-wrap">
          <canvas id="mini" width="144" height="108"> </canvas>
          <span>● 나 &nbsp; ◆ 조사할 곳</span>
        </div>
        <div id="bottom-hint">
          방향키 / WASD 이동 &nbsp;·&nbsp; 스페이스 조사
        </div>
        <div id="dpad">
          <button data-dir="up" aria-label="위로 이동">▲</button>
          <button data-dir="left" aria-label="왼쪽으로 이동">◀</button>
          <button data-dir="right" aria-label="오른쪽으로 이동">▶</button>
          <button data-dir="down" aria-label="아래로 이동">▼</button>
        </div>
        <button id="interact">조사 / 말하기 <small>SPACE</small></button>
      </div>
      <div id="toast" role="status"></div>
      <div id="saved" role="status"></div>
      <div id="overlay" hidden></div>
    <section id="intro" aria-label="게임 시작 이야기" hidden>
        <div id="intro-bg"></div>
        <div id="intro-light"></div>
        <img id="intro-player" alt="시간 속으로 떨어지는 내 캐릭터" />
        <div id="intro-caption" aria-live="polite"></div>
      <button id="intro-skip">건너뛰기</button>
    </section>
    <section id="basic-tutorial" aria-label="첫 플레이 튜토리얼" hidden>
      <div class="tutorial-dim"></div>
      <button id="tutorial-skip">건너뛰기</button>
      <div class="tutorial-guide" role="dialog" aria-modal="true" aria-live="polite">
        <div class="tutorial-speaker">게임도우미</div>
        <p id="tutorial-text"></p>
        <div class="tutorial-footer">
          <span id="tutorial-count"></span>
          <button id="tutorial-next" class="primary">다음</button>
        </div>
      </div>
    </section>
    <section id="defeat" aria-label="전투 패배" hidden>
        <div class="defeat-stage">
          <img id="defeat-player" alt="쓰러진 내 캐릭터" />
        </div>
        <div class="defeat-shade"></div>
        <div id="defeat-result" role="dialog" aria-modal="true"></div>
      </section>
    </main>
    <script type="module" src="/game.js?v=36.0"></script>
  </body>
</html>
