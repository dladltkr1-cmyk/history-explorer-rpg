<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시간탐험대 화면 크기 검수</title><style>body{margin:0;background:#263f48;color:#f6ecd1;font:16px system-ui}nav{padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{padding:12px;border-radius:9px;border:0;font:inherit}iframe{display:block;margin:0 12px 12px;border:2px solid #94b1a3;background:#142d32}small{color:#d1d9ce}</style><nav><b>화면 크기 검수</b><button data-view="1024,768">가로 1024×768</button><button data-view="768,1024">세로 768×1024</button><small>같은 브라우저의 시험 저장을 사용합니다. 실물 태블릿 검수가 아닙니다.</small></nav><iframe id="preview" title="화면 크기별 게임 검수" width="1024" height="768" src="./index.html"></iframe><script>const f=document.querySelector('#preview');for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{[f.width,f.height]=b.dataset.view.split(',');};</script></html>
